openapi: 3.0.3
info:
  title: Karyakram API
  version: 1.0.0
  description: Event management and ticket booking
paths:
  /api/auth/login/:
    post:
      operationId: auth_login_create
      description: |-
        Takes a set of user credentials and returns an access and refresh JSON web
        token pair to prove the authentication of those credentials.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenObtainPair'
          description: ''
  /api/auth/logout/:
    post:
      operationId: auth_logout_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutResponse'
          description: ''
  /api/auth/profile/:
    get:
      operationId: auth_profile_retrieve
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
          description: ''
    patch:
      operationId: auth_profile_partial_update
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUserProfile'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUserProfile'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUserProfile'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
          description: ''
  /api/auth/refresh/:
    post:
      operationId: auth_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/auth/register/:
    post:
      operationId: auth_register_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Register'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Register'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Register'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
          description: ''
  /api/dashboard/:
    get:
      operationId: dashboard_retrieve
      tags:
      - dashboard
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardResponse'
          description: ''
  /api/events/:
    get:
      operationId: events_list
      tags:
      - events
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EventList'
          description: ''
    post:
      operationId: events_create
      tags:
      - events
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventDetail'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EventDetail'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EventDetail'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventDetail'
          description: ''
  /api/events/{slug}/:
    get:
      operationId: events_retrieve
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - events
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventDetail'
          description: ''
    put:
      operationId: events_update
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - events
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventDetail'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EventDetail'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EventDetail'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventDetail'
          description: ''
    patch:
      operationId: events_partial_update
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - events
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedEventDetail'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedEventDetail'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedEventDetail'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventDetail'
          description: ''
    delete:
      operationId: events_destroy
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - events
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/events/{slug}/approve/:
    patch:
      operationId: events_approve_partial_update
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - events
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAdminEventApproval'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAdminEventApproval'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAdminEventApproval'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminEventApproval'
          description: ''
  /api/events/mine/:
    get:
      operationId: events_mine_list
      tags:
      - events
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EventList'
          description: ''
components:
  schemas:
    AdminDashboard:
      type: object
      properties:
        role:
          type: string
          default: admin
        profile:
          $ref: '#/components/schemas/UserProfile'
      required:
      - profile
    AdminEventApproval:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        approval_status:
          $ref: '#/components/schemas/ApprovalStatusEnum'
      required:
      - id
    ApprovalStatusEnum:
      enum:
      - approved
      - pending
      - rejected
      type: string
      description: |-
        * `approved` - Approved
        * `pending` - Pending
        * `rejected` - Rejected
    CategoryEnum:
      enum:
      - comedy
      - music
      - sports
      - conference
      - workshop
      - theatre
      - festival
      - other
      type: string
      description: |-
        * `comedy` - Comedy
        * `music` - Music
        * `sports` - Sports
        * `conference` - Conference
        * `workshop` - Workshop
        * `theatre` - Theatre
        * `festival` - Festival
        * `other` - Other
    DashboardResponse:
      oneOf:
      - $ref: '#/components/schemas/UserDashboard'
      - $ref: '#/components/schemas/OrganizerDashboard'
      - $ref: '#/components/schemas/AdminDashboard'
      discriminator:
        propertyName: role
        mapping:
          None: '#/components/schemas/AdminDashboard'
    EventDetail:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        slug:
          type: string
          readOnly: true
          pattern: ^[-a-zA-Z0-9_]+$
        organizer:
          type: integer
          readOnly: true
        organizer_name:
          type: string
          readOnly: true
        title:
          type: string
          maxLength: 200
        description:
          type: string
        date_time:
          type: string
          format: date-time
        location:
          type: string
          maxLength: 200
        terms_and_conditions:
          type: string
        category:
          $ref: '#/components/schemas/CategoryEnum'
        banner_image:
          type: string
          format: uri
        capacity:
          type: integer
          maximum: 2147483647
          minimum: 0
          nullable: true
          description: Optional venue-wide cap, independent of per-ticket-type quantities
        gallery_images:
          type: array
          items:
            $ref: '#/components/schemas/EventGalleryImage'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        status:
          $ref: '#/components/schemas/StatusEnum'
        approval_status:
          allOf:
          - $ref: '#/components/schemas/ApprovalStatusEnum'
          readOnly: true
      required:
      - approval_status
      - banner_image
      - created_at
      - date_time
      - description
      - gallery_images
      - id
      - location
      - organizer
      - organizer_name
      - slug
      - title
      - updated_at
    EventGalleryImage:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        image:
          type: string
          format: uri
        uploaded_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - id
      - image
      - uploaded_at
    EventList:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        slug:
          oneOf:
          - type: string
            maxLength: 220
            pattern: ^[-a-zA-Z0-9_]+$
          - type: string
            maxLength: 0
        title:
          type: string
          maxLength: 200
        date_time:
          type: string
          format: date-time
        location:
          type: string
          maxLength: 200
        category:
          $ref: '#/components/schemas/CategoryEnum'
        banner_image:
          type: string
          format: uri
        status:
          $ref: '#/components/schemas/StatusEnum'
        approval_status:
          $ref: '#/components/schemas/ApprovalStatusEnum'
        organizer_name:
          type: string
          readOnly: true
      required:
      - banner_image
      - date_time
      - id
      - location
      - organizer_name
      - title
    LogoutRequest:
      type: object
      properties:
        refresh:
          type: string
      required:
      - refresh
    LogoutResponse:
      type: object
      properties:
        detail:
          type: string
      required:
      - detail
    OrganizerDashboard:
      type: object
      properties:
        role:
          type: string
          default: organizer
        profile:
          $ref: '#/components/schemas/UserProfile'
      required:
      - profile
    PatchedAdminEventApproval:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        approval_status:
          $ref: '#/components/schemas/ApprovalStatusEnum'
    PatchedEventDetail:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        slug:
          type: string
          readOnly: true
          pattern: ^[-a-zA-Z0-9_]+$
        organizer:
          type: integer
          readOnly: true
        organizer_name:
          type: string
          readOnly: true
        title:
          type: string
          maxLength: 200
        description:
          type: string
        date_time:
          type: string
          format: date-time
        location:
          type: string
          maxLength: 200
        terms_and_conditions:
          type: string
        category:
          $ref: '#/components/schemas/CategoryEnum'
        banner_image:
          type: string
          format: uri
        capacity:
          type: integer
          maximum: 2147483647
          minimum: 0
          nullable: true
          description: Optional venue-wide cap, independent of per-ticket-type quantities
        gallery_images:
          type: array
          items:
            $ref: '#/components/schemas/EventGalleryImage'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        status:
          $ref: '#/components/schemas/StatusEnum'
        approval_status:
          allOf:
          - $ref: '#/components/schemas/ApprovalStatusEnum'
          readOnly: true
    PatchedUserProfile:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        first_name:
          type: string
          maxLength: 50
        last_name:
          type: string
          maxLength: 50
        username:
          type: string
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
          pattern: ^[\w.@+-]+$
          maxLength: 150
        email:
          type: string
          format: email
          readOnly: true
        phone_number:
          type: string
          nullable: true
        date_of_birth:
          type: string
          format: date
          nullable: true
        role:
          allOf:
          - $ref: '#/components/schemas/UserProfileRoleEnum'
          readOnly: true
        is_email_verified:
          type: boolean
        is_phone_verified:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        organization_name:
          type: string
          nullable: true
          maxLength: 255
        is_nepali_citizen:
          type: boolean
        citizenship_number:
          type: string
          nullable: true
          maxLength: 14
        pan_number:
          type: string
          nullable: true
          maxLength: 9
        bank_name:
          type: string
          nullable: true
          maxLength: 255
        bank_account_number:
          type: string
          nullable: true
          maxLength: 20
        is_organizer_approved:
          type: boolean
          readOnly: true
    Register:
      type: object
      properties:
        first_name:
          type: string
          maxLength: 50
        last_name:
          type: string
          maxLength: 50
        username:
          type: string
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
          pattern: ^[\w.@+-]+$
          maxLength: 150
        email:
          type: string
          format: email
        password:
          type: string
          writeOnly: true
        password_confirm:
          type: string
          writeOnly: true
        phone_number:
          type: string
        date_of_birth:
          type: string
          format: date
          nullable: true
        role:
          $ref: '#/components/schemas/RegisterRoleEnum'
        organization_name:
          type: string
          nullable: true
          maxLength: 255
        is_nepali_citizen:
          type: boolean
        citizenship_number:
          type: string
          nullable: true
        pan_number:
          type: string
          nullable: true
        bank_name:
          type: string
          nullable: true
          maxLength: 255
        bank_account_number:
          type: string
          nullable: true
          maxLength: 20
      required:
      - date_of_birth
      - email
      - first_name
      - last_name
      - password
      - password_confirm
      - phone_number
      - username
    RegisterRoleEnum:
      enum:
      - user
      - organizer
      type: string
      description: |-
        * `user` - user
        * `organizer` - organizer
    StatusEnum:
      enum:
      - draft
      - published
      - cancelled
      type: string
      description: |-
        * `draft` - Draft
        * `published` - Published
        * `cancelled` - Cancelled
    TokenObtainPair:
      type: object
      properties:
        username:
          type: string
          writeOnly: true
        password:
          type: string
          writeOnly: true
        access:
          type: string
          readOnly: true
        refresh:
          type: string
          readOnly: true
      required:
      - access
      - password
      - refresh
      - username
    TokenRefresh:
      type: object
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
      required:
      - access
      - refresh
    UserDashboard:
      type: object
      properties:
        role:
          type: string
          default: user
        profile:
          $ref: '#/components/schemas/UserProfile'
      required:
      - profile
    UserProfile:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        first_name:
          type: string
          maxLength: 50
        last_name:
          type: string
          maxLength: 50
        username:
          type: string
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
          pattern: ^[\w.@+-]+$
          maxLength: 150
        email:
          type: string
          format: email
          readOnly: true
        phone_number:
          type: string
          nullable: true
        date_of_birth:
          type: string
          format: date
          nullable: true
        role:
          allOf:
          - $ref: '#/components/schemas/UserProfileRoleEnum'
          readOnly: true
        is_email_verified:
          type: boolean
        is_phone_verified:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        organization_name:
          type: string
          nullable: true
          maxLength: 255
        is_nepali_citizen:
          type: boolean
        citizenship_number:
          type: string
          nullable: true
          maxLength: 14
        pan_number:
          type: string
          nullable: true
          maxLength: 9
        bank_name:
          type: string
          nullable: true
          maxLength: 255
        bank_account_number:
          type: string
          nullable: true
          maxLength: 20
        is_organizer_approved:
          type: boolean
          readOnly: true
      required:
      - created_at
      - email
      - first_name
      - id
      - is_organizer_approved
      - last_name
      - role
      - updated_at
      - username
    UserProfileRoleEnum:
      enum:
      - user
      - organizer
      type: string
      description: |-
        * `user` - User
        * `organizer` - Organizer
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
