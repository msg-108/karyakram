openapi: 3.0.3
info:
  title: Karyakram API
  version: 1.0.0
  description: Event management and ticket booking
paths:
  /api/admin/events/{id}/approve/:
    post:
      operationId: approveOrRejectEvent
      description: Approve or reject a SUBMITTED event. Approving does not publish
        it — publishing is a separate admin action. Rejecting requires a reason and
        returns the event to the organizer for edits.
      summary: Approve or reject event
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - 'Admin: Events'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventApprovalActionRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EventApprovalActionRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EventApprovalActionRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminEventReview'
          description: Event review status updated.
        '400':
          description: Invalid approval request, or event is not submitted.
        '404':
          description: Event not found.
  /api/admin/events/{id}/publish/:
    post:
      operationId: publishEvent
      description: Publish an APPROVED event, making it visible to the public (subject
        to its visibility setting). Organizers cannot call this endpoint directly
        — only an admin can publish.
      summary: Publish event
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - 'Admin: Events'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminEventReview'
          description: Event published.
        '400':
          description: Event is not approved.
        '404':
          description: Event not found.
  /api/admin/events/pending/:
    get:
      operationId: listPendingEvents
      description: Return all events currently awaiting admin review.
      summary: List pending events
      tags:
      - 'Admin: Events'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminEventReview'
          description: ''
  /api/admin/organizers/{user_id}/approval/:
    post:
      operationId: approveOrRejectOrganizer
      description: Approve or reject an organizer registration request. Approving
        activates the account. Rejecting keeps the account inactive and stores the
        rejection reason.
      summary: Approve or reject organizer
      parameters:
      - in: path
        name: user_id
        schema:
          type: integer
        required: true
      tags:
      - 'Admin: Organizers'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizerApprovalActionRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OrganizerApprovalActionRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OrganizerApprovalActionRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizerProfile'
          description: Organizer approval status updated.
        '400':
          description: Invalid approval request.
        '404':
          description: Organizer not found.
  /api/admin/organizers/pending/:
    get:
      operationId: listPendingOrganizers
      description: Return all organizer accounts that have verified their email but
        are still waiting for administrator approval.
      summary: List pending organizers
      tags:
      - 'Admin: Organizers'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrganizerProfile'
          description: ''
  /api/auth/login/:
    post:
      operationId: login
      description: Authenticate using username and password. Returns JWT access and
        refresh tokens. Login is denied if the email is unverified, the account is
        inactive, or the organizer is still awaiting administrator approval.
      summary: Authenticate user
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserTokenObtainPairRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UserTokenObtainPairRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UserTokenObtainPairRequest'
        required: true
      responses:
        '200':
          description: Returns `access` and `refresh` JWTs.
        '400':
          description: Invalid credentials, unverified email, or inactive account.
        '403':
          description: Organizer account pending admin approval.
  /api/auth/logout/:
    post:
      operationId: logout
      description: Blacklist the provided refresh token.
      summary: Log out
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          description: Logged out successfully.
        '400':
          description: Invalid token.
  /api/auth/password-reset/:
    post:
      operationId: requestPasswordReset
      description: Send a password reset OTP to the given email address.
      summary: Request password reset
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordResetRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordResetRequestRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          description: If the email exists and is active, an OTP is sent.
  /api/auth/password-reset/confirm/:
    post:
      operationId: confirmPasswordReset
      description: Change the password using a valid reset OTP.
      summary: Confirm password reset
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          description: Password changed successfully.
        '400':
          description: Code is invalid or expired.
  /api/auth/password-reset/verify/:
    post:
      operationId: verifyPasswordResetCode
      description: Verify that a password reset OTP is valid.
      summary: Verify password reset code
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetVerifyRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordResetVerifyRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordResetVerifyRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          description: Code is valid.
        '400':
          description: Code is invalid or expired.
  /api/auth/register/organizer/:
    post:
      operationId: registerOrganizer
      description: Create a new organizer account and upload the required verification
        documents. After email verification, the account must be approved by an administrator
        before login is allowed.
      summary: Register an organizer account
      tags:
      - Authentication
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OrganizerRegisterRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OrganizerRegisterRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPublic'
          description: Account created; OTP sent.
        '400':
          description: Validation error.
  /api/auth/register/user/:
    post:
      operationId: registerUser
      description: Create a new standard user account. The account is created inactive
        and a 6-digit verification OTP is sent to the registered email address. The
        user must verify their email before they can log in.
      summary: Register a user account
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRegisterRequest'
            examples:
              Request:
                value:
                  username: sitagharti
                  email: sita@example.com
                  password: S3cure!Pass
                  password_confirm: S3cure!Pass
                  first_name: Sita
                  last_name: Gharti
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UserRegisterRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UserRegisterRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPublic'
          description: Account created; OTP sent.
        '400':
          description: Validation error.
  /api/auth/resend-otp/:
    post:
      operationId: resendVerificationOTP
      description: Generate and send a new email verification OTP. Requests are subject
        to the configured resend cooldown period.
      summary: Resend verification OTP
      tags:
      - Email Verification
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OTPRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OTPRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OTPRequestRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailResponse'
          description: A new code was sent.
        '400':
          description: Cooldown still active, or no account found.
  /api/auth/token/refresh/:
    post:
      operationId: auth_token_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/auth/verify-otp/:
    post:
      operationId: verifyEmailOTP
      description: Verify the 6-digit OTP sent to the user's email address. Regular
        users become active immediately after verification. Organizer accounts remain
        pending until approved by an administrator.
      summary: Verify email address
      tags:
      - Email Verification
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OTPVerifyRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OTPVerifyRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OTPVerifyRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailResponse'
          description: Email verified.
        '400':
          description: Invalid/expired code, or too many attempts.
  /api/bookings/:
    get:
      operationId: listUserBookings
      description: Return every booking belonging to the authenticated user, in any
        status.
      summary: List my bookings
      tags:
      - Bookings
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BookingList'
          description: ''
    post:
      operationId: createBooking
      description: Create a booking for one or more ticket tiers of a published event.
        Validates availability and deducts remaining ticket quantity atomically to
        prevent overselling.
      summary: Book tickets for an event
      tags:
      - Bookings
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BookingCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BookingCreateRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingDetail'
          description: Booking created.
        '400':
          description: Validation error — event not published, deadline passed, invalid
            tier, or insufficient remaining quantity.
  /api/bookings/{booking_id}/payment/initiate/:
    post:
      operationId: initiatePayment
      summary: Initiate a payment for a booking
      parameters:
      - in: path
        name: booking_id
        schema:
          type: integer
        required: true
      tags:
      - Payments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentInitiateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PaymentInitiateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PaymentInitiateRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          description: Payment data or URL for frontend to process
  /api/bookings/{booking_id}/payment/verify/:
    post:
      operationId: verifyPayment
      summary: Verify a payment
      parameters:
      - in: path
        name: booking_id
        schema:
          type: integer
        required: true
      tags:
      - Payments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentVerifyRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PaymentVerifyRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PaymentVerifyRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          description: Payment verified successfully
        '400':
          description: Payment verification failed
  /api/bookings/{id}/:
    get:
      operationId: getBooking
      description: Return full details for a single booking owned by the authenticated
        user.
      summary: Get booking details
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Bookings
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingDetail'
          description: ''
        '404':
          description: Booking not found.
  /api/bookings/{id}/cancel/:
    post:
      operationId: cancelBooking
      description: Cancel a CONFIRMED booking owned by the authenticated user, restoring
        each item's quantity back onto its ticket tier.
      summary: Cancel booking
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Bookings
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingDetail'
          description: Booking cancelled.
        '400':
          description: Only confirmed bookings can be cancelled.
        '404':
          description: Booking not found.
  /api/dashboard/admin/revenue/:
    get:
      operationId: getAdminRevenueAnalytics
      summary: Admin platform-wide revenue
      tags:
      - 'Dashboard: Admin'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminRevenueStatistics'
          description: ''
  /api/dashboard/admin/summary/:
    get:
      operationId: getAdminDashboardSummary
      summary: Admin platform-wide metrics
      tags:
      - 'Dashboard: Admin'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminPlatformStatistics'
          description: ''
  /api/dashboard/notifications/:
    get:
      operationId: listNotifications
      description: Return the authenticated user's notifications. Pass ?unread_only=true
        to return only unread notifications.
      summary: List notifications
      tags:
      - 'Dashboard: Notifications'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/NotificationSummary'
          description: ''
  /api/dashboard/organizer/events/:
    get:
      operationId: listDashboardOrganizerEvents
      description: Return every event belonging to the authenticated organizer, for
        the dashboard event-list card.
      summary: List organizer's events (dashboard)
      tags:
      - 'Dashboard: Organizer'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EventSummary'
          description: ''
  /api/dashboard/organizer/events/{event_id}/attendees/:
    get:
      operationId: listEventAttendees
      description: Return attendees for a specific event owned by the authenticated
        organizer.
      summary: List event attendees
      parameters:
      - in: path
        name: event_id
        schema:
          type: integer
        required: true
      tags:
      - 'Dashboard: Organizer'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AttendeeSummary'
          description: ''
  /api/dashboard/organizer/events/upcoming/:
    get:
      operationId: listOrganizerUpcomingEvents
      description: Return the authenticated organizer's events that haven't started
        yet.
      summary: List organizer's upcoming events
      tags:
      - 'Dashboard: Organizer'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EventSummary'
          description: ''
  /api/dashboard/organizer/orders/recent/:
    get:
      operationId: listRecentOrders
      description: Return the most recent orders placed for the organizer's events.
      summary: List recent orders
      tags:
      - 'Dashboard: Organizer'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrderSummary'
          description: ''
  /api/dashboard/organizer/reports/{report_type}/export/:
    get:
      operationId: exportReport
      description: Generate and return a downloadable CSV report for one of the organizer's
        analytics views (e.g. 'sales', 'attendees').
      summary: Export report
      parameters:
      - in: path
        name: report_type
        schema:
          type: string
        required: true
      tags:
      - 'Dashboard: Organizer'
      security:
      - jwtAuth: []
      responses:
        '200':
          description: Report file bytes (CSV).
        '400':
          description: Invalid report type requested.
  /api/dashboard/organizer/statistics/checkins/:
    get:
      operationId: getCheckInStatistics
      description: Return total attendees checked in vs. expected across the organizer's
        events.
      summary: Get check-in statistics
      tags:
      - 'Dashboard: Organizer'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckInStatistics'
          description: ''
  /api/dashboard/organizer/statistics/events/:
    get:
      operationId: getEventStatistics
      description: 'Return aggregate statistics across the authenticated organizer''s
        events: total events, tickets sold, and attendees checked in.'
      summary: Get event statistics
      tags:
      - 'Dashboard: Organizer'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventStatistics'
          description: ''
  /api/dashboard/organizer/statistics/qr-scans/:
    get:
      operationId: getQRScanStatistics
      description: Return total, valid, and invalid QR scans across the organizer's
        events.
      summary: Get QR scan statistics
      tags:
      - 'Dashboard: Organizer'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QRScanStatistics'
          description: ''
  /api/dashboard/organizer/statistics/revenue/:
    get:
      operationId: getRevenueAnalytics
      description: Return the authenticated organizer's total revenue and a month-by-month
        breakdown, suitable for charting.
      summary: Get revenue analytics
      tags:
      - 'Dashboard: Organizer'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevenueAnalytics'
          description: ''
  /api/dashboard/organizer/statistics/tickets/:
    get:
      operationId: getTicketSalesSummary
      description: Return total tickets sold vs. available across the organizer's
        events.
      summary: Get ticket sales summary
      tags:
      - 'Dashboard: Organizer'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketSalesSummary'
          description: ''
  /api/dashboard/organizer/summary/:
    get:
      operationId: getOrganizerDashboardSummary
      description: 'Return the authenticated organizer''s dashboard summary card:
        total events, upcoming events, and unread notification count.'
      summary: Get organizer dashboard summary
      tags:
      - 'Dashboard: Organizer'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizerProfileSummary'
          description: ''
  /api/dashboard/user/activity/:
    get:
      operationId: listRecentActivity
      description: Return a chronological feed of the authenticated user's recent
        activity (e.g. bookings, payments, verification events).
      summary: List recent activity
      tags:
      - 'Dashboard: User'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ActivityItem'
          description: ''
  /api/dashboard/user/summary/:
    get:
      operationId: getUserDashboardSummary
      description: 'Return the authenticated user''s dashboard summary card: upcoming
        ticket count, total ticket count, and unread notification count.'
      summary: Get user dashboard summary
      tags:
      - 'Dashboard: User'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileSummary'
          description: ''
  /api/events/:
    get:
      operationId: listPublicEvents
      description: Return published, publicly-visible events. Supports free-text search
        and filtering by category, city, and date range via query parameters.
      summary: Browse published events
      parameters:
      - in: query
        name: category
        schema:
          type: string
        description: Category slug to filter by.
      - in: query
        name: city
        schema:
          type: string
        description: City to filter by (exact match).
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: q
        schema:
          type: string
        description: Free-text search query.
      - in: query
        name: start_date_from
        schema:
          type: string
        description: ISO 8601 datetime lower bound.
      - in: query
        name: start_date_to
        schema:
          type: string
        description: ISO 8601 datetime upper bound.
      tags:
      - 'Events: Public'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPublicEventListList'
          description: ''
