components:
  schemas:
    ActionEnum:
      enum:
      - approve
      - reject
      type: string
      description: |-
        * `approve` - approve
        * `reject` - reject
    ActivityItem:
      type: object
      properties:
        occurred_at:
          type: string
          format: date-time
          readOnly: true
        description:
          type: string
          readOnly: true
      required:
      - description
      - occurred_at
    AdminEventReview:
      type: object
      description: |-
        Read shape for the admin review queue and for the response after an
        approve/reject action — surfaces `approved_by`/`approved_at` fields
        that neither the public nor organizer serializers expose.
      properties:
        id:
          type: integer
          readOnly: true
        slug:
          type: string
          readOnly: true
          pattern: ^[-a-zA-Z0-9_]+$
        title:
          type: string
          readOnly: true
        category:
          allOf:
          - $ref: '#/components/schemas/EventCategory'
          readOnly: true
        organizer_name:
          type: string
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/StatusDd4Enum'
          readOnly: true
        start_datetime:
          type: string
          format: date-time
          readOnly: true
        end_datetime:
          type: string
          format: date-time
          readOnly: true
        approved_by_username:
          type: string
          readOnly: true
        approved_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        rejection_reason:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - approved_at
      - approved_by_username
      - category
      - created_at
      - end_datetime
      - id
      - organizer_name
      - rejection_reason
      - slug
      - start_datetime
      - status
      - title
    AdminPlatformStatistics:
      type: object
      properties:
        total_users:
          type: integer
          readOnly: true
        total_organizers:
          type: integer
          readOnly: true
        pending_events:
          type: integer
          readOnly: true
        active_events:
          type: integer
          readOnly: true
      required:
      - active_events
      - pending_events
      - total_organizers
      - total_users
    AdminRevenueStatistics:
      type: object
      properties:
        total_revenue:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          readOnly: true
        total_successful_payments:
          type: integer
          readOnly: true
        total_refunds:
          type: integer
          readOnly: true
      required:
      - total_refunds
      - total_revenue
      - total_successful_payments
    AttendeeSummary:
      type: object
      properties:
        attendee_name:
          type: string
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        ticket_status:
          type: string
          readOnly: true
        checked_in:
          type: boolean
          readOnly: true
      required:
      - attendee_name
      - checked_in
      - email
      - ticket_status
    BookingCreateRequest:
      type: object
      description: |-
        Input shape for POST /bookings/:

            { "event": 1, "items": [{ "ticket_tier": 1, "quantity": 2 }] }

        A plain Serializer, not a ModelSerializer, since nothing here maps
        1:1 onto Booking's own fields — `items` doesn't exist as a Booking
        field at all, and `total_amount`/`status` are computed by the service,
        never accepted as input. `event` is a bare IntegerField (not a
        PrimaryKeyRelatedField) so a nonexistent event ID is rejected inside
        services.create_booking as a business-logic ValidationError alongside
        the "must be PUBLISHED" check it already does, rather than as a
        separately-worded serializer-layer error for the same underlying
        problem (event not usable).
      properties:
        event:
          type: integer
          minimum: 1
        items:
          type: array
          items:
            $ref: '#/components/schemas/BookingItemInputRequest'
      required:
      - event
      - items
    BookingDetail:
      type: object
      description: |-
        Full read shape for GET /bookings/{id}/ — same fields as the list
        serializer today, kept as a distinct class since a detail view
        predictably grows fields (e.g. `payment` once BookingPayment is real)
        that the list view won't want.
      properties:
        id:
          type: integer
          readOnly: true
        event:
          type: integer
          readOnly: true
          description: 'PROTECT rather than CASCADE: an event with confirmed bookings
            attached should not be deletable out from under them. Events are archived,
            not deleted, once they have any real activity — see apps.events.services.delete_event.'
        event_title:
          type: string
          readOnly: true
        event_start_datetime:
          type: string
          format: date-time
          readOnly: true
        event_venue:
          type: string
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/Status390Enum'
          readOnly: true
        total_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
          description: 'Sum of (quantity x price_at_purchase) across this booking''s
            items, computed once at creation time. Not a property/annotation: it must
            survive unchanged even if TicketTier.price changes later, exactly like
            price_at_purchase on each BookingItem.'
        items:
          type: array
          items:
            $ref: '#/components/schemas/BookingItem'
          readOnly: true
        cancelled_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - cancelled_at
      - created_at
      - event
      - event_start_datetime
      - event_title
      - event_venue
      - id
      - items
      - status
      - total_amount
      - updated_at
    BookingItem:
      type: object
      description: Read-only line item, nested inside BookingDetailSerializer/BookingListSerializer.
      properties:
        id:
          type: integer
          readOnly: true
        ticket_tier:
          type: integer
          readOnly: true
        ticket_tier_name:
          type: string
          readOnly: true
        quantity:
          type: integer
          readOnly: true
        price_at_purchase:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
        subtotal:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
      required:
      - id
      - price_at_purchase
      - quantity
      - subtotal
      - ticket_tier
      - ticket_tier_name
    BookingItemInputRequest:
      type: object
      description: One requested line of a BookingCreateSerializer's `items` list.
      properties:
        ticket_tier:
          type: integer
          minimum: 1
        quantity:
          type: integer
          minimum: 1
      required:
      - quantity
      - ticket_tier
    BookingList:
      type: object
      description: |-
        Compact shape for GET /bookings/ — includes items (a user's booking
        list is typically short, and knowing *what* was booked without a
        second request per row is worth the join, unlike events' equivalent
        list serializer which omits long text fields for a different reason:
        payload size on a potentially-long public list).
      properties:
        id:
          type: integer
          readOnly: true
        event:
          type: integer
          readOnly: true
          description: 'PROTECT rather than CASCADE: an event with confirmed bookings
            attached should not be deletable out from under them. Events are archived,
            not deleted, once they have any real activity — see apps.events.services.delete_event.'
