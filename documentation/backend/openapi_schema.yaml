          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
          readOnly: true
          nullable: true
        banner:
          type: string
          format: uri
          nullable: true
          readOnly: true
        start_datetime:
          type: string
          format: date-time
          readOnly: true
        end_datetime:
          type: string
          format: date-time
          readOnly: true
        registration_deadline:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        capacity:
          type: integer
          readOnly: true
        gallery_images:
          type: array
          items:
            $ref: '#/components/schemas/EventImage'
          readOnly: true
        ticket_tiers:
          type: array
          items:
            $ref: '#/components/schemas/TicketTier'
          readOnly: true
      required:
      - address
      - banner
      - capacity
      - category
      - city
      - description
      - district
      - end_datetime
      - gallery_images
      - id
      - latitude
      - longitude
      - organizer_name
      - province
      - registration_deadline
      - short_description
      - slug
      - start_datetime
      - terms_and_conditions
      - ticket_tiers
      - title
      - venue
    PublicEventList:
      type: object
      description: |-
        Compact shape for list/search/filter results — omits long text fields
        (`description`, `terms_and_conditions`) that a listing view doesn't
        need and that would bloat a multi-result response.
      properties:
        id:
          type: integer
          readOnly: true
        slug:
          type: string
          readOnly: true
          pattern: ^[-a-zA-Z0-9_]+$
        title:
          type: string
          readOnly: true
        short_description:
          type: string
          readOnly: true
          description: Short summary shown in listing/search results.
        category:
          allOf:
          - $ref: '#/components/schemas/EventCategory'
          readOnly: true
        organizer_name:
          type: string
          readOnly: true
        venue:
          type: string
          readOnly: true
        city:
          type: string
          readOnly: true
        banner:
          type: string
          format: uri
          nullable: true
          readOnly: true
        start_datetime:
          type: string
          format: date-time
          readOnly: true
        end_datetime:
          type: string
          format: date-time
          readOnly: true
      required:
      - banner
      - category
      - city
      - end_datetime
      - id
      - organizer_name
      - short_description
      - slug
      - start_datetime
      - title
      - venue
    QRScanStatistics:
      type: object
      properties:
        total_scans:
          type: integer
          readOnly: true
        valid_scans:
          type: integer
          readOnly: true
        invalid_scans:
          type: integer
          readOnly: true
      required:
      - invalid_scans
      - total_scans
      - valid_scans
    RevenueAnalytics:
      type: object
      properties:
        total_revenue:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
        currency:
          type: string
          readOnly: true
        by_month:
          type: array
          items:
            $ref: '#/components/schemas/RevenueByMonth'
          readOnly: true
      required:
      - by_month
      - currency
      - total_revenue
    RevenueByMonth:
      type: object
      description: |-
        One (label, amount) point in RevenueAnalytics.by_month. A dedicated
        serializer rather than a bare list-of-lists field, so the API response
        has named keys instead of positional ["Jan 2026", "1200.00"] pairs a
        client would have to remember the order of.
      properties:
        label:
          type: string
          readOnly: true
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
      required:
      - amount
      - label
    RoleEnum:
      enum:
      - USER
      - ORGANIZER
      type: string
      description: |-
        * `USER` - User
        * `ORGANIZER` - Organizer
    Status390Enum:
      enum:
      - PENDING
      - CONFIRMED
      - CANCELLED
      - EXPIRED
      type: string
      description: |-
        * `PENDING` - Pending
        * `CONFIRMED` - Confirmed
        * `CANCELLED` - Cancelled
        * `EXPIRED` - Expired
    StatusDd4Enum:
      enum:
      - DRAFT
      - SUBMITTED
      - APPROVED
      - REJECTED
      - PUBLISHED
      - ARCHIVED
      type: string
      description: |-
        * `DRAFT` - Draft
        * `SUBMITTED` - Submitted for Review
        * `APPROVED` - Approved
        * `REJECTED` - Rejected
        * `PUBLISHED` - Published
        * `ARCHIVED` - Archived
    Ticket:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        booking_id:
          type: integer
          readOnly: true
        booking_item:
          allOf:
          - $ref: '#/components/schemas/BookingItem'
          readOnly: true
        attendee_name:
          type: string
          maxLength: 255
        attendee_email:
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
        status:
          $ref: '#/components/schemas/TicketStatusEnum'
        status_display:
          type: string
          readOnly: true
        qr_code_payload:
          type: string
          description: Signed JWT for the QR code
        qr_code_image:
          type: string
          format: uri
          nullable: true
        checked_in_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - attendee_name
      - booking_id
      - booking_item
      - created_at
      - id
      - status_display
    TicketSalesSummary:
      type: object
      properties:
        total_sold:
          type: integer
          readOnly: true
        total_available:
          type: integer
          readOnly: true
      required:
      - total_available
      - total_sold
    TicketStatusEnum:
      enum:
      - VALID
      - CHECKED_IN
      - CANCELLED
      type: string
      description: |-
        * `VALID` - Valid
        * `CHECKED_IN` - Checked In
        * `CANCELLED` - Cancelled
    TicketSummary:
      type: object
      properties:
        ticket_id:
          type: string
          format: uuid
        event_title:
          type: string
        event_date_time:
          type: string
          format: date-time
        event_location:
          type: string
        seat_or_tier:
          type: string
        status:
          type: string
      required:
      - event_date_time
      - event_location
      - event_title
      - seat_or_tier
      - status
      - ticket_id
    TicketTier:
      type: object
      description: |-
        Used for both reading and organizer-side writing. `remaining_quantity`
        is read-only here even though it's a real model field: it is only ever
        set by services.py (initialized to `quantity` on creation, decremented
        later by the future bookings app), never supplied directly by a client.
      properties:
        id:
          type: integer
          readOnly: true
        event:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 150
        description:
          type: string
        price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        quantity:
          type: integer
        remaining_quantity:
          type: integer
          readOnly: true
          description: Set to `quantity` on creation. Will be decremented by the future
            bookings app as tickets are sold; this app only initializes and validates
            it, it does not decrement it itself.
        display_order:
          type: integer
          maximum: 32767
          minimum: 0
        is_active:
          type: boolean
          description: Inactive tiers are hidden from public purchase flows without
            deleting their history.
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - event
      - id
      - name
      - quantity
      - remaining_quantity
      - updated_at
    TicketTierCreateInputRequest:
      type: object
      description: |-
        Nested-input shape for ticket tiers supplied inline on
        OrganizerEventWriteSerializer (event creation). Excludes `event`
        entirely (unknown until the parent Event is created) and
        `remaining_quantity` (always derived from `quantity`), rather than
        marking them read-only on TicketTierSerializer and reusing it, since a
        read-only field silently dropped from nested input can mask a client
        mistake that this shape makes structurally impossible.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 150
        description:
          type: string
        price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        quantity:
          type: integer
        display_order:
          type: integer
          maximum: 32767
          minimum: 0
        is_active:
          type: boolean
          description: Inactive tiers are hidden from public purchase flows without
            deleting their history.
      required:
      - name
      - quantity
    TicketTierRequest:
      type: object
      description: |-
        Used for both reading and organizer-side writing. `remaining_quantity`
        is read-only here even though it's a real model field: it is only ever
        set by services.py (initialized to `quantity` on creation, decremented
        later by the future bookings app), never supplied directly by a client.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 150
        description:
          type: string
        price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        quantity:
          type: integer
        display_order:
          type: integer
          maximum: 32767
          minimum: 0
        is_active:
          type: boolean
          description: Inactive tiers are hidden from public purchase flows without
            deleting their history.
      required:
      - name
      - quantity
    TokenRefresh:
      type: object
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
      required:
      - access
      - refresh
    TokenRefreshRequest:
      type: object
      properties:
        refresh:
          type: string
          minLength: 1
      required:
      - refresh
    UserProfileSummary:
      type: object
      properties:
        user:
          allOf:
          - $ref: '#/components/schemas/UserPublic'
          readOnly: true
        upcoming_ticket_count:
          type: integer
          readOnly: true
        total_ticket_count:
          type: integer
          readOnly: true
        unread_notification_count:
          type: integer
          readOnly: true
      required:
      - total_ticket_count
      - unread_notification_count
      - upcoming_ticket_count
      - user
    UserPublic:
      type: object
      description: Read-only representation used in nested/response contexts.
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          readOnly: true
          description: Required. 3-30 characters. Letters, digits, dot, underscore,
            hyphen only.
        email:
          type: string
          format: email
          readOnly: true
        first_name:
          type: string
          readOnly: true
        last_name:
          type: string
          readOnly: true
        role:
          allOf:
          - $ref: '#/components/schemas/RoleEnum'
          readOnly: true
        is_email_verified:
          type: boolean
          readOnly: true
        is_approved:
          type: boolean
          readOnly: true
          description: Organizer-only. Set True once an admin approves the organizer.
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - email
      - first_name
      - id
      - is_approved
      - is_email_verified
      - last_name
      - role
      - username
    UserRegisterRequest:
      type: object
      description: Registration for role=USER. Account is created inactive; see services.register_user.
      properties:
        username:
          type: string
          minLength: 1
          description: Required. 3-30 characters. Letters, digits, dot, underscore,
            hyphen only.
          maxLength: 150
        email:
          type: string
          format: email
          minLength: 1
        password:
          type: string
          writeOnly: true
          minLength: 1
        password_confirm:
          type: string
          writeOnly: true
          minLength: 1
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
      required:
      - email
      - first_name
      - last_name
      - password
      - password_confirm
      - username
    UserTokenObtainPairRequest:
      type: object
      description: |-
        Adds role/verification claims to the JWT and enforces requirement #9's
        login gating (unverified email / inactive / pending organizer
        approval) before SimpleJWT's default validate() issues any token.
      properties:
        username:
          type: string
          writeOnly: true
          minLength: 1
        password:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - password
      - username
    VisibilityEnum:
      enum:
      - PUBLIC
      - UNLISTED
      type: string
      description: |-
        * `PUBLIC` - Public
        * `UNLISTED` - Unlisted
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
