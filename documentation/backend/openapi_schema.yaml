          type: string
          readOnly: true
        event_start_datetime:
          type: string
          format: date-time
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/Status390Enum'
          readOnly: true
        total_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
          description: 'Sum of (quantity x price_at_purchase) across this booking''s
            items, computed once at creation time. Not a property/annotation: it must
            survive unchanged even if TicketTier.price changes later, exactly like
            price_at_purchase on each BookingItem.'
        items:
          type: array
          items:
            $ref: '#/components/schemas/BookingItem'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
